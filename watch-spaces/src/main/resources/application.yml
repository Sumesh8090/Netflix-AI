server:
  port: ${PORT:8080}

spring:
  config:
    # Optional local file with KEY=value lines (copy .env.example to .env in the project root). Environment variables still win.
    import: optional:file:./.env[.properties]
  application:
    name: watch-spaces
  datasource:
    # MySQL 8. Create the schema yourself or let the driver do it (createDatabaseIfNotExist=true).
    url: ${DB_URL:jdbc:mysql://localhost:3306/watchspaces?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}          # required: no default on purpose
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}    # see db/schema.sql for the equivalent hand-written DDL
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}             # required: at least 32 characters, never commit it
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:60}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  seed:
    enabled: ${SEED_ENABLED:true}
    default-password: ${SEED_PASSWORD:}  # required only when SEED_ENABLED=true
  realtime:
    host-grace-ms: ${HOST_GRACE_MS:15000}
    reconnect-grace-ms: ${RECONNECT_GRACE_MS:5000}
    trivia-tick-ms: ${TRIVIA_TICK_MS:250}
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}
    empty-room-ttl-ms: ${EMPTY_ROOM_TTL_MS:600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{corr:-app}] %logger{20} - %msg%n"
  level:
    com.watchspaces: INFO
